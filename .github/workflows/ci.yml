name: CI

on:
  push:
    branches: [main, premium]
  pull_request:
    branches: [main, premium]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netmonitor_test
          POSTGRES_USER: netmonitor
          POSTGRES_PASSWORD: netmonitor_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netmonitor -d netmonitor_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: netmonitor_test
          MYSQL_USER: netmonitor
          MYSQL_PASSWORD: netmonitor_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot_test_password"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          NETMONITOR_TEST_POSTGRESQL_URL: postgresql+asyncpg://netmonitor:netmonitor_test_password@127.0.0.1:5432/netmonitor_test
          NETMONITOR_TEST_MYSQL_URL: mysql+asyncmy://netmonitor:netmonitor_test_password@127.0.0.1:3306/netmonitor_test
          NETMONITOR_ALLOW_DESTRUCTIVE_DATABASE_TESTS: '1'
      - run: python -m compileall app
      - run: python -c "from sqlalchemy.orm import configure_mappers; import app.models; configure_mappers()"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
