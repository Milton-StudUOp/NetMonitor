version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-network_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-nm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nm_user} -d ${POSTGRES_DB:-network_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nm_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nm_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/${POSTGRES_DB:-network_monitor}
      REDIS_URL: redis://redis:6379/0
      WHATSAPP_WEB_SERVICE_URL: http://whatsapp-web:3010
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-web:
        condition: service_healthy
    networks:
      - monitor-net
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 5555 --reload

  whatsapp-web:
    build:
      context: ./whatsapp-web
      dockerfile: Dockerfile
    container_name: nm_whatsapp_web
    restart: unless-stopped
    environment:
      WHATSAPP_WEB_SERVICE_TOKEN: ${WHATSAPP_WEB_SERVICE_TOKEN:?Define WHATSAPP_WEB_SERVICE_TOKEN in .env}
      WHATSAPP_PRINT_QR_TERMINAL: ${WHATSAPP_PRINT_QR_TERMINAL:-false}
    volumes:
      - whatsappauth:/data/auth
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - monitor-net

volumes:
  pgdata:
  redisdata:
  whatsappauth:

networks:
  monitor-net:
    driver: bridge
